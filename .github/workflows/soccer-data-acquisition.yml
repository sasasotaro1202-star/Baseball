name: Soccer Data Acquisition (15-year historical)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Number of seasons to fetch (default 15)"
        required: false
        default: "15"

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-parallel.txt
      - name: Acquire historical soccer data (football-data.co.uk)
        run: |
          python -m parallel.acquire_soccer_historical --years ${{ github.event.inputs.years || 15 }}
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-acquisition-report
          path: artifacts/soccer_acquisition_report.json
      - name: Commit acquired data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/soccer/historical
          git diff --staged --quiet || git commit -m "Auto-update: historical soccer data acquisition"
          git push
