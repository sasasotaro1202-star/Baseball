name: Baseball Operations Status Snapshot
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: baseball-ops-status
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Build status snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          names=['Baseball Production Backtest','Baseball Mac OOS','Baseball Autonomous Research','Baseball Autonomous Recovery']
          out={'schema':'baseball-ops-v1','created_at_utc':datetime.now(timezone.utc).isoformat(),'workflows':{}}
          for name in names:
              url=f'https://api.github.com/repos/{repo}/actions/runs?per_page=20&status=completed'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: data=json.load(r)
              runs=[x for x in data.get('workflow_runs',[]) if x.get('name')==name]
              active_url=f'https://api.github.com/repos/{repo}/actions/runs?per_page=100'
              req=urllib.request.Request(active_url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r: active=json.load(r)
              act=[x for x in active.get('workflow_runs',[]) if x.get('name')==name and x.get('status') in {'queued','waiting','requested','in_progress'}]
              out['workflows'][name]={'active':act[:10],'last_completed':runs[0] if runs else None}
          os.makedirs('ops',exist_ok=True)
          open('ops/baseball_status.json','w').write(json.dumps(out,indent=2))
          PY
      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: baseball-ops-status-${{ github.run_id }}
          path: ops/baseball_status.json
          retention-days: 30
