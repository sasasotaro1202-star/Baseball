name: Integrated Baseball Pipeline
on:
  workflow_dispatch:

jobs:
  collect-baseball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect MLB data (StatsAPI)
        run: python run.py collect-baseball
      - name: Show what was collected
        run: python run.py inventory
      - name: Upload baseball data
        uses: actions/upload-artifact@v4
        with:
          name: baseball-data
          path: data/raw/
          if-no-files-found: warn

  elo-baseline:
    needs: [collect-baseball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: baseball-data
          path: data/raw/
      - name: Run Elo baseline + base rate comparison
        run: python run.py features
      - name: Show results
        run: cat data/results/elo_baseline.json
      - name: Upload baseline results
        uses: actions/upload-artifact@v4
        with:
          name: elo-baseline-results
          path: data/results/elo_baseline.json
          if-no-files-found: warn
