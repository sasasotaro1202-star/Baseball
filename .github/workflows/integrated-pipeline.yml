name: Integrated Baseball+Soccer Pipeline
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'MLB/NPB seasons to process (comma-separated)'
        required: false
        default: '2024,2025,2026'
      soccer_leagues:
        description: 'Soccer leagues to process (comma-separated)'
        required: false
        default: 'E0,SP1,D1,I1,F1,N1'
jobs:
  collect-baseball:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect MLB data
        run: |
          python run.py collect-baseball --statcast-windows 2
      - name: Upload baseball data
        uses: actions/upload-artifact@v4
        with:
          name: baseball-data
          path: |
            data/raw/
            data/events/

  collect-soccer:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sasasotaro1202-star/soccer
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect soccer data
        run: |
          python run.py collect-soccer --sofascore-budget 10
      - name: Upload soccer data
        uses: actions/upload-artifact@v4
        with:
          name: soccer-data
          path: data/raw/

  features-research:
    needs: [collect-baseball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: baseball-data
          path: data/
      - run: pip install -r requirements.txt
      - name: Build features
        run: python run.py features
      - name: Run backtest research
        run: python run.py research
      - name: Upload models
        uses: actions/upload-artifact@v4
        with:
          name: baseball-models
          path: |
            data/models/
            data/results/

  predict-verify:
    needs: [features-research]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: baseball-data
          path: data/
      - run: pip install -r requirements.txt
      - name: Run predictions
        run: python run.py predict
      - name: Verify predictions
        run: python run.py verify
      - name: Show inventory
        run: python run.py inventory
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: predictions-results
          path: |
            data/predictions/
            data/results/settlement/
