name: Baseball Autonomous Recovery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-autonomous-recovery
  cancel-in-progress: false

jobs:
  watchdog:
    name: Autonomous pipeline watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile, cancel stuck runs and recover the autonomous pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; api=os.environ.get('GITHUB_API_URL','https://api.github.com')
          workflows={'production':'baseball_production.yml','mac':'baseball_mac_compute.yml','research':'baseball_research.yml'}
          STALE_MINUTES={'production':155,'mac':180,'research':180}
          QUEUED_STALE_MINUTES=20

          def request(method,path,payload=None):
              body=None if payload is None else json.dumps(payload).encode('utf-8')
              req=urllib.request.Request(api.rstrip('/')+path,data=body,method=method,headers={
                  'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Baseball-Autonomous-Recovery','Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      raw=resp.read(); return json.loads(raw.decode('utf-8')) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode('utf-8',errors='replace')
                  raise RuntimeError(f'GitHub API {method} {path} failed: HTTP {exc.code}: {detail}') from exc

          def runs(filename):
              return request('GET',f'/repos/{repo}/actions/workflows/{filename}/runs?per_page=20').get('workflow_runs',[])

          data={k:runs(v) for k,v in workflows.items()}
          now=datetime.now(timezone.utc)

          def active(row): return bool(row) and row.get('status') in {'queued','in_progress','waiting','pending','requested'}
          def success(row): return bool(row) and row.get('conclusion')=='success'
          def ts(row):
              value=(row or {}).get('created_at') or (row or {}).get('updated_at')
              if not value: return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(value.replace('Z','+00:00'))
          def age_minutes(row): return (now-ts(row)).total_seconds()/60.0 if row else 0.0

          def cancel_stuck(label,row):
              if not active(row): return False
              age=age_minutes(row)
              limit=QUEUED_STALE_MINUTES if row.get('status') in {'queued','waiting','requested'} else STALE_MINUTES[label]
              if age <= limit: return False
              run_id=row['id']
              print(f'[WATCHDOG] STUCK {label} run={run_id} status={row.get("status")} age_min={age:.1f} limit={limit}; cancelling')
              request('POST',f'/repos/{repo}/actions/runs/{run_id}/cancel')
              return True

          for label,rows in data.items():
              if rows: print(f'[WATCHDOG] {label} latest={rows[0].get("id")} status={rows[0].get("status")} conclusion={rows[0].get("conclusion")} age_min={age_minutes(rows[0]):.1f}')

          prod=data['production'][0] if data['production'] else None
          mac=data['mac'][0] if data['mac'] else None
          research=data['research'][0] if data['research'] else None

          stuck=False
          for label,row in (('production',prod),('mac',mac),('research',research)):
              stuck = cancel_stuck(label,row) or stuck
          if stuck:
              print('[WATCHDOG] stuck/runner-blocked stage cancelled; next reconciliation will dispatch the required replacement safely')
              raise SystemExit(0)

          def dispatch(label,workflow):
              print(f'[WATCHDOG] dispatch {label}: {workflow}')
              request('POST',f'/repos/{repo}/actions/workflows/{workflow}/dispatches',{'ref':'main'})
              print(f'[WATCHDOG] dispatched {workflow}')

          if not active(prod) and not success(prod):
              dispatch('production recovery',workflows['production']); raise SystemExit(0)
          if success(prod) and (not success(mac) or ts(mac)<ts(prod)):
              if not active(mac): dispatch('Mac OOS',workflows['mac'])
              raise SystemExit(0)
          if success(mac) and (not success(research) or ts(research)<ts(mac)):
              if not active(research): dispatch('autonomous research',workflows['research'])
              raise SystemExit(0)
          if success(research) and ts(research)>ts(prod):
              if not active(prod): dispatch('next production cycle',workflows['production'])
              raise SystemExit(0)
          print('[WATCHDOG] pipeline healthy or already active; no action required')
          PY

      - name: Recovery policy summary
        if: always()
        run: |
          echo '[RECOVERY] Hosted watchdog runs independently of the Mac self-hosted runner.'
          echo '[RECOVERY] Production -> Mac OOS -> Research -> next Production is enforced as a state machine.'
          echo '[RECOVERY] Failed/cancelled/stuck stages are recovered without duplicating active work.'
          echo '[RECOVERY] Queued/runner-blocked runs are treated as stuck after 20 minutes; active computation gets a generous timeout margin.'
