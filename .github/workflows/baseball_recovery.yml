name: Baseball Autonomous Recovery

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-autonomous-recovery
  cancel-in-progress: false

jobs:
  watchdog:
    name: Autonomous pipeline watchdog
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Reconcile and recover the autonomous pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from datetime import datetime, timezone

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          workflows = {
              "production": "baseball_production.yml",
              "mac": "baseball_mac_compute.yml",
              "research": "baseball_research.yml",
          }

          def request(method, path, payload=None):
              url = api.rstrip("/") + path
              body = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=body, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "Baseball-Autonomous-Recovery",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return json.loads(raw.decode("utf-8")) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: HTTP {exc.code}: {detail}") from exc

          def runs(filename):
              data = request("GET", f"/repos/{repo}/actions/workflows/{filename}/runs?per_page=20")
              return data.get("workflow_runs", [])

          data = {k: runs(v) for k, v in workflows.items()}
          for k, rows in data.items():
              print(f"[WATCHDOG] {k}: {rows[:3]}")

          def active(row):
              return bool(row) and row.get("status") in {"queued", "in_progress", "waiting", "pending"}

          def success(row):
              return bool(row) and row.get("conclusion") == "success"

          def ts(row):
              if not row or not row.get("updated_at"):
                  return datetime.min.replace(tzinfo=timezone.utc)
              return datetime.fromisoformat(row["updated_at"].replace("Z", "+00:00"))

          prod = data["production"][0] if data["production"] else None
          mac = data["mac"][0] if data["mac"] else None
          research = data["research"][0] if data["research"] else None

          def dispatch(label, workflow):
              print(f"[WATCHDOG] dispatch {label}: {workflow}")
              request("POST", f"/repos/{repo}/actions/workflows/{workflow}/dispatches", {"ref": "main"})
              print(f"[WATCHDOG] dispatched {workflow}")

          if not active(prod) and not success(prod):
              dispatch("production recovery", workflows["production"])
              raise SystemExit(0)
          if success(prod) and (not success(mac) or ts(mac) < ts(prod)):
              if not active(mac):
                  dispatch("Mac OOS", workflows["mac"])
              raise SystemExit(0)
          if success(mac) and (not success(research) or ts(research) < ts(mac)):
              if not active(research):
                  dispatch("autonomous research", workflows["research"])
              raise SystemExit(0)
          if success(research) and ts(research) > ts(prod):
              if not active(prod):
                  dispatch("next production cycle", workflows["production"])
              raise SystemExit(0)
          print("[WATCHDOG] pipeline healthy or already active; no action required")
          PY

      - name: Recovery policy summary
        if: always()
        run: |
          echo "[RECOVERY] 15-minute autonomous state reconciliation is enabled."
          echo "[RECOVERY] Production -> Mac OOS -> Research -> next Production is enforced as a state machine."
          echo "[RECOVERY] Failed/cancelled stages are dispatched again; active stages are never duplicated."
          echo "[RECOVERY] Research success automatically closes the loop into the next Production cycle."
