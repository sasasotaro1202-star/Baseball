name: Baseball Autonomous Recovery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-autonomous-recovery
  cancel-in-progress: false

jobs:
  watchdog:
    name: Autonomous pipeline watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reconcile and recover the autonomous pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from datetime import datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          workflows = {
              "production": "Baseball Production Backtest",
              "mac": "Baseball Mac Compute Research",
              "research": "Baseball Autonomous Research",
          }

          def runs(name):
              raw = subprocess.check_output([
                  "gh", "run", "list", "--repo", repo, "--workflow", name,
                  "--limit", "20", "--json", "databaseId,status,conclusion,createdAt,updatedAt,headSha"
              ], text=True)
              return json.loads(raw)

          data = {k: runs(v) for k, v in workflows.items()}
          for k, rows in data.items():
              print(f"[WATCHDOG] {k}: {rows[:3]}")

          def active(row):
              return row and row["status"] in {"queued", "in_progress", "waiting", "pending"}

          def success(row):
              return row and row["conclusion"] == "success"

          def ts(row):
              if not row:
                  return datetime.min
              return datetime.fromisoformat(row["updatedAt"].replace("Z", "+00:00")).replace(tzinfo=None)

          prod = data["production"][0] if data["production"] else None
          mac = data["mac"][0] if data["mac"] else None
          research = data["research"][0] if data["research"] else None

          def dispatch(label, workflow):
              print(f"[WATCHDOG] dispatch {label}: {workflow}")
              subprocess.run(["gh", "workflow", "run", workflow, "--repo", repo, "--ref", "main"], check=True)

          # 1. Recover Production first. A failed/cancelled production stage is
          #    retried as a fresh run; queued/in-progress runs are never duplicated.
          if not active(prod) and not success(prod):
              dispatch("production recovery", workflows["production"])
              raise SystemExit(0)

          # 2. A successful Production completion must eventually have a successful
          #    Mac OOS run newer than it. Otherwise launch/recover Mac.
          if success(prod) and (not success(mac) or ts(mac) < ts(prod)):
              if not active(mac):
                  dispatch("Mac OOS", workflows["mac"])
              raise SystemExit(0)

          # 3. A successful Mac OOS completion must eventually have a successful
          #    Research run newer than it. Otherwise launch/recover Research.
          if success(mac) and (not success(research) or ts(research) < ts(mac)):
              if not active(research):
                  dispatch("autonomous research", workflows["research"])
              raise SystemExit(0)

          # 4. Once Research succeeds after the latest Production, start the next
          #    autonomous production cycle. This closes the continuous loop.
          if success(research) and ts(research) > ts(prod):
              if not active(prod):
                  dispatch("next production cycle", workflows["production"])
              raise SystemExit(0)

          print("[WATCHDOG] pipeline healthy or already active; no action required")
          PY

      - name: Recovery policy summary
        if: always()
        run: |
          echo "[RECOVERY] 15-minute autonomous state reconciliation is enabled."
          echo "[RECOVERY] Production -> Mac OOS -> Research -> next Production is enforced as a state machine."
          echo "[RECOVERY] Failed/cancelled stages are dispatched again; active stages are never duplicated."
          echo "[RECOVERY] Research success automatically closes the loop into the next Production cycle."
