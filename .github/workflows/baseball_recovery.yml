name: Baseball Autonomous Recovery

on:
  workflow_run:
    workflows:
      - "Baseball Production Backtest"
      - "Baseball Mac Compute Research"
      - "Baseball Autonomous Research"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: baseball-autonomous-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Retry failed autonomous stage
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion != 'success' &&
        github.event.workflow_run.conclusion != 'cancelled' &&
        github.event.workflow_run.run_attempt < 3
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retry failed upstream jobs through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            echo "[RECOVERY] workflow_dispatch has no upstream run id; automatic recovery is event-driven."
            exit 0
          fi
          echo "[RECOVERY] retrying failed jobs for ${GITHUB_REPOSITORY} run ${RUN_ID} (attempt ${{ github.event.workflow_run.run_attempt }})"
          curl --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          echo "[RECOVERY] failed jobs re-queued"

      - name: Recovery policy summary
        if: always()
        run: |
          echo "[RECOVERY] Production -> Mac -> Research is event-driven."
          echo "[RECOVERY] Failed upstream runs receive bounded automatic retries."
          echo "[RECOVERY] Cancelled runs are not recursively retried."
          echo "[RECOVERY] Third attempts stop automatic retry to prevent infinite CI loops."
