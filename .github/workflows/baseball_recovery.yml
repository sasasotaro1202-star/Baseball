name: Baseball Autonomous Recovery

on:
  push:
    paths:
      - '.github/workflows/baseball_recovery.yml'
      - '.github/workflows/baseball-parallel-source-acquisition.yml'
      - '.github/workflows/baseball-data-acquisition.yml'
      - '.github/workflows/baseball_production.yml'
      - '.github/workflows/baseball_matchday.yml'
      - '.github/workflows/baseball_research.yml'
      - '.github/workflows/baseball-mlb-competition.yml'
      - '.github/workflows/baseball_game_type_ablation.yml'
      - '.github/workflows/validate-code.yml'
      - 'monitoring/recovery_controller.py'
  workflow_run:
    workflows:
      - Baseball Production Backtest
      - Baseball Mac OOS Compute
      - Baseball Autonomous Research
      - Baseball Source Acquisition
      - Baseball Parallel NPB Source Acquisition
      - Baseball Matchday Intelligence
      - Baseball MLB + Competition Research
      - Baseball NPB Game-Type OOS Ablation
      - Validate Code Syntax
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  # Isolate scheduled watchdogs from workflow_run notifications. Successful
  # workflow_run events normally skip the recovery job and must never cancel
  # an active watchdog that is reconciling failures or stale runs.
  group: baseball-autonomous-recovery-${{ github.event_name }}-${{ github.event.workflow_run.conclusion || 'scheduled' }}
  cancel-in-progress: true

jobs:
  watchdog:
    if: ${{ github.event_name != 'workflow_run' || contains(fromJson('["failure","timed_out","action_required"]'), github.event.workflow_run.conclusion) }}
    name: Autonomous pipeline watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - name: Reconcile, cancel stuck runs and recover the autonomous pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          mkdir -p recovery_diagnostics
          python3 -m py_compile monitoring/recovery_controller.py
          python3 monitoring/recovery_controller.py
      - name: Publish recovery diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-recovery-${{ github.run_id }}
          path: recovery_diagnostics/
          if-no-files-found: error
          retention-days: 30
