name: Baseball Mac Compute Research

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  BASEBALL_TIME_BUDGET_SEC: "3600"
  PYTHONUNBUFFERED: "1"

concurrency:
  group: baseball-mac-compute
  cancel-in-progress: false

jobs:
  mac-research:
    name: High-throughput Mac OOS research
    runs-on: [self-hosted, macOS, baseball]
    timeout-minutes: 70
    steps:
      - name: Checkout latest main state
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - name: Verify Mac worker
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          python3 --version
      - name: Prepare isolated Python environment
        run: |
          set -euo pipefail
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply production-quality hardening
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python source_quality_gate.py
          python repair_npb_syntax.py
          python npb_runtime_patch.py
          python npb_quality_runtime_patch.py
          python baseball_mlb_score_hilo_patch.py
          python baseball_quality_runtime_patch.py
          python baseball_backtest_runtime_patch.py
          python baseball_production_runtime_patch.py
      - name: Preflight
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m py_compile baseball_backtest.py npb_multi_source.py npb_runtime_patch.py npb_quality_runtime_patch.py baseball_mlb_score_hilo_patch.py baseball_quality_runtime_patch.py baseball_backtest_runtime_patch.py baseball_production_runtime_patch.py backtest_audit.py source_quality_gate.py repair_npb_syntax.py research/research_loop.py
          python backtest_audit.py
      - name: Run NPB deep OOS backtest with checkpoint-safe retries
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p data results
          for attempt in 1 2 3; do
            echo "[MAC NPB] attempt ${attempt}/3"
            if BASEBALL_TIME_BUDGET_SEC=1800 python baseball_backtest.py --npb-only --data-dir data; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "[MAC NPB] all retries failed"
          exit 1
      - name: Run MLB deep OOS backtest with retries
        run: |
          set -euo pipefail
          . .venv/bin/activate
          mkdir -p data results
          for attempt in 1 2 3; do
            echo "[MAC MLB] attempt ${attempt}/3"
            if BASEBALL_TIME_BUDGET_SEC=1800 python baseball_backtest.py --mlb-only --data-dir data --mlb-start 2020 --mlb-end 2026; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "[MAC MLB] all retries failed"
          exit 1
      - name: Persist Mac OOS results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ results/npb/ results/mlb/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "[MAC] no new OOS state"; else git commit -m "Persist Mac OOS research results"; fi
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "[MAC] failed to persist OOS state after 5 attempts"
          exit 1
      - name: Start autonomous research analysis without GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/baseball_research.yml/dispatches'
          data=json.dumps({'ref':'main'}).encode()
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          for attempt in range(1,6):
              req=urllib.request.Request(url,data=data,headers=headers,method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      if r.status in (201,204): print(f'[PIPELINE] autonomous research dispatched on attempt {attempt}'); raise SystemExit(0)
                      raise RuntimeError(f'HTTP {r.status}')
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, RuntimeError) as e:
                  print(f'[PIPELINE] dispatch attempt {attempt}/5 failed: {e}')
                  if attempt < 5: time.sleep(attempt*5)
          raise SystemExit('[PIPELINE] failed to dispatch autonomous research after 5 attempts')
          PY
      - name: Upload Mac research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-mac-research-${{ github.run_id }}
          path: |
            results/
          if-no-files-found: warn
          retention-days: 30
