name: Baseball Backtest NPB Multi-Source

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
  push:
    paths:
      - 'baseball_backtest.py'
      - 'npb_multi_source.py'
      - 'requirements.txt'
      - '.github/workflows/baseball_backtest.yml'

permissions:
  contents: write

concurrency:
  group: baseball-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare multi-source NPB dataset
        env:
          NPB_YEAR: '2026'
          NPB_END_DATE: '2026-09-03'
          NPB_DOWNLOAD_WORKERS: '6'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p data results
          python npb_multi_source.py
          test -s data/2026_multi_source_pbp.csv
          python - <<'PY'
          import pandas as pd
          p='data/2026_multi_source_pbp.csv'
          d=pd.read_csv(p)
          starters=((d.home_starter.fillna('').astype(str)!='') & (d.away_starter.fillna('').astype(str)!='')).sum()
          lines=(d.home_starter_era.notna() & d.away_starter_era.notna()).sum()
          print('games=',d.game_id.nunique(),'starters=',starters,'starter_lines=',lines)
          print('weather=',d.weather_temp_c.notna().sum())
          assert d.game_id.nunique() >= 600
          assert starters >= 500
          PY

      - name: Run NPB walk-forward backtest
        env:
          PYTHONUNBUFFERED: '1'
          BASEBALL_TIME_BUDGET_SEC: '1560'
        run: |
          set -euo pipefail
          python baseball_backtest.py --npb-only --data-dir data

      - name: Validate and show results
        if: always()
        run: |
          set -euo pipefail
          echo '=== result files ==='
          find results -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          echo '=== NPB summary ==='
          if [ -f results/npb_backtest_summary.csv ]; then cat results/npb_backtest_summary.csv; fi
          echo '=== model comparison ==='
          if [ -f results/npb_model_comparison.csv ]; then cat results/npb_model_comparison.csv; fi
          echo '=== source audit ==='
          if [ -f data/source_official_npb_audit.csv ]; then cat data/source_official_npb_audit.csv; fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-backtest-results
          path: |
            results/
            data/source_official_npb_audit.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit results
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Update NPB multi-source backtest results'
            git push
          fi
