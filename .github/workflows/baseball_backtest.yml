name: Baseball Backtest NPB MLB

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NPB + MLB backtest
        env:
          PYTHONUNBUFFERED: "1"
          MLB_ENRICH_STARTERS: "0"
        run: python baseball_backtest.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: baseball-backtest-results
          path: results/
          if-no-files-found: warn
