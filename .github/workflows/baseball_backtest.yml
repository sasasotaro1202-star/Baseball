name: Baseball Backtest NPB Massive Resumable

on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
  push:
    paths:
      - 'baseball_backtest_massive_resumable.py'
      - 'npb_multi_source_massive_resumable.py'
      - 'requirements.txt'
      - '.github/workflows/baseball_backtest.yml'

permissions:
  contents: write

concurrency:
  group: baseball-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare/resume NPB dataset
        env:
          NPB_START_YEAR: '2010'
          NPB_END_YEAR: '2026'
          NPB_DOWNLOAD_WORKERS: '6'
          NPB_COLLECTION_BUDGET_SEC: '1560'
          NPB_COLLECTION_SAFETY_SEC: '90'
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          mkdir -p data results
          python npb_multi_source_massive_resumable.py
          test -s data/npb_multi_source_games_all.csv
          python - <<'PY'
          import json, pandas as pd
          s='data/checkpoints/npb_collection_status.json'
          c='data/source_coverage.csv'
          status=json.load(open(s,encoding='utf-8'))
          cov=pd.read_csv(c)
          print('STATUS:',status)
          print('COVERAGE:')
          print(cov.to_string(index=False))
          assert int(status['aggregate_games']) >= 1
          PY

      - name: Run/resume NPB walk-forward backtest
        if: ${{ hashFiles('data/checkpoints/npb_collection_status.json') != '' }}
        env:
          PYTHONUNBUFFERED: '1'
          BASEBALL_TIME_BUDGET_SEC: '1560'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          s=json.load(open('data/checkpoints/npb_collection_status.json',encoding='utf-8'))
          if not s.get('complete',False):
              print('[BACKTEST WAIT] Dataset is partial; skip model until collection completes.')
              raise SystemExit(0)
          print('[BACKTEST READY] Dataset complete; starting/resuming walk-forward.')
          PY
          python baseball_backtest_massive_resumable.py --npb-only --data-dir data

      - name: Show status/results
        if: always()
        run: |
          set +e
          echo '=== collection status ==='
          [ -f data/checkpoints/npb_collection_status.json ] && cat data/checkpoints/npb_collection_status.json || true
          echo '=== source coverage ==='
          [ -f data/source_coverage.csv ] && cat data/source_coverage.csv || true
          echo '=== result files ==='
          find results -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          echo '=== NPB summary ==='
          [ -f results/npb_backtest_summary.csv ] && cat results/npb_backtest_summary.csv || true
          echo '=== model comparison ==='
          [ -f results/npb_model_comparison.csv ] && cat results/npb_model_comparison.csv || true

      - name: Upload checkpoint and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-backtest-state
          path: |
            data/npb_multi_source_games_all.csv
            data/npb_games/
            data/source_coverage.csv
            data/source_failures.csv
            data/source_official_npb_audit.csv
            data/checkpoints/
            data/weather/
            results/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit checkpoint/results for automatic resume
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/checkpoints/ data/npb_multi_source_games_all.csv data/npb_games/ data/weather/ data/source_coverage.csv data/source_failures.csv data/source_official_npb_audit.csv data/official_*.html results/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No state/result changes to commit.'
          else
            git commit -m 'Persist resumable NPB backtest state'
            git push
          fi
