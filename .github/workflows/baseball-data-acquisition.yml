name: Baseball Source Acquisition - Parallel Lanes

on:
  workflow_dispatch:
  push:
    paths:
      - 'control/baseball-acquisition-trigger.txt'
  schedule:
    - cron: '14 11 * * *'

permissions:
  contents: write

concurrency:
  group: baseball-source-acquisition
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  npb:
    name: NPB historical + postseason acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Hosted runner health gate
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --max-time 20 https://api.github.com/rate_limit >/dev/null
          echo '[NPB HEALTH] GitHub HTTPS PASS'
      - name: Setup Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/npb-venv"
          "$RUNNER_TEMP/npb-venv/bin/python" -m pip install -r requirements.txt
          echo "$RUNNER_TEMP/npb-venv/bin" >> "$GITHUB_PATH"
      - name: Acquisition preflight
        run: |
          set -euo pipefail
          python -m py_compile npb_multi_source.py npb_runtime_patch.py source_quality_gate.py
          python source_quality_gate.py
          python npb_runtime_patch.py
          python -m py_compile npb_multi_source.py
          python source_quality_gate.py
      - name: NPB source connectivity
        run: |
          set -euo pipefail
          for url in https://npb.jp/ https://spaia.jp/baseball/npb/api/weekly_schedule; do
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --retry-all-errors --max-time 15 "$url" >/dev/null
          done
          echo '[NPB HEALTH] source connectivity PASS'
      - name: NPB full-scope resumable acquisition
        id: npb_acquire
        continue-on-error: true
        env:
          NPB_START_YEAR: "2017"
          NPB_END_YEAR: "2026"
          NPB_DOWNLOAD_WORKERS: "12"
          NPB_LIGHT_ENRICH: "1"
          NPB_MIN_STARTER_LINE_COVERAGE: "70"
          NPB_MIN_STARTER_COVERAGE: "70"
          NPB_REQUIRED_START_YEAR: "2020"
          NPB_COLLECTION_BUDGET_SEC: "6000"
          NPB_COLLECTION_SAFETY_SEC: "600"
          BASEBALL_TIME_BUDGET_SEC: "6000"
        run: python npb_multi_source.py
      - name: Persist NPB checkpoints and outputs
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/checkpoints data/npb_games data/weather data/source_coverage.csv npb_multi_source.py
          if git diff --cached --quiet; then
            echo '[NPB] no checkpoint/output changes'
            exit 0
          fi
          git commit -m 'Checkpoint parallel NPB acquisition lane'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "[NPB] checkpoint persisted on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Finalize NPB acquisition outcome
        if: always()
        run: |
          set -euo pipefail
          outcome='\x24{{ steps.npb_acquire.outcome }}'
          echo "[NPB] acquisition outcome=$outcome"
          if [ "$outcome" != "success" ]; then
            echo '[NPB] failed; resumable checkpoint is preserved'
            exit 1
          fi

  mlb:
    name: MLB historical + postseason-ready acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Hosted runner health gate
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --max-time 20 https://statsapi.mlb.com/api/v1/sports/1 >/dev/null
          echo '[MLB HEALTH] MLB Stats API PASS'
      - name: Setup Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mlb-venv"
          "$RUNNER_TEMP/mlb-venv/bin/python" -m pip install -r requirements.txt
          echo "$RUNNER_TEMP/mlb-venv/bin" >> "$GITHUB_PATH"
      - name: MLB acquisition preflight
        run: |
          set -euo pipefail
          python -m py_compile mlb_incremental_acquire.py production_data_quality_gate.py production_integrity_gate.py
          python source_quality_gate.py
      - name: MLB full-scope acquisition with incremental refresh
        id: mlb_acquire
        continue-on-error: true
        env:
          MLB_INCREMENTAL_TIMEOUT: "20"
          MLB_CORRECTION_DAYS: "7"
          MLB_BOOTSTRAP_START_YEAR: "2020"
        run: python mlb_incremental_acquire.py
      - name: Validate MLB cache
        id: mlb_quality
        if: steps.mlb_acquire.outcome == 'success'
        run: |
          set -euo pipefail
          test -s data/mlb_games.csv
          python - <<'PY'
          import pandas as pd
          p='data/mlb_games.csv'
          d=pd.read_csv(p, low_memory=False)
          if len(d) <= 100:
              raise SystemExit(f'MLB cache unexpectedly small: {len(d)}')
          if 'game_type' not in d.columns:
              raise SystemExit('MLB cache missing official game_type metadata')
          print(f'[MLB] rows={len(d)} min={d.datetime.min()} max={d.datetime.max()}')
          PY
          python production_data_quality_gate.py
      - name: Persist MLB checkpoints and successful cache
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/checkpoints/mlb_schedule_chunks data/checkpoints/mlb_acquisition_manifest.json
          if [ '\x24{{ steps.mlb_quality.outcome }}' = 'success' ]; then
            git add data/mlb_games.csv
            if [ -f data/checkpoints/mlb_collection_status.json ]; then
              git add data/checkpoints/mlb_collection_status.json
            fi
          fi
          if git diff --cached --quiet; then
            echo '[MLB] no checkpoint/cache changes'
            exit 0
          fi
          git commit -m 'Checkpoint parallel MLB acquisition lane'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "[MLB] checkpoint/cache persisted on attempt $attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          exit 1
      - name: Finalize MLB acquisition outcome
        if: always()
        run: |
          set -euo pipefail
          acquire='\x24{{ steps.mlb_acquire.outcome }}'
          quality='\x24{{ steps.mlb_quality.outcome }}'
          echo "[MLB] acquisition=$acquire quality=$quality"
          if [ "$acquire" != "success" ] || [ "$quality" != "success" ]; then
            echo '[MLB] production cache not validated; checkpoints remain resumable'
            exit 1
          fi

  competition:
    name: Competition / tournament scope audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/competition-venv"
          "$RUNNER_TEMP/competition-venv/bin/python" -m pip install -r requirements.txt
          echo "$RUNNER_TEMP/competition-venv/bin" >> "$GITHUB_PATH"
      - name: Audit competition scope
        run: |
          set -euo pipefail
          python -m py_compile research/competition_scope_audit.py
          python research/competition_scope_audit.py | tee competition_scope_audit.log
          test -s results/competition_scope_audit.json
          python -m json.tool results/competition_scope_audit.json >/dev/null
      - name: Upload competition audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-competition-scope-\x24{{ github.run_id }}
          path: |
            results/competition_scope_audit.json
            competition_scope_audit.log
          if-no-files-found: warn
          retention-days: 30
