name: Baseball Production Backtest

on:
  workflow_dispatch:
    inputs:
      npb_start_year: {description: "NPB start year", required: false, default: "1990"}
      npb_end_year: {description: "NPB end year", required: false, default: "2026"}
      mlb_start_year: {description: "MLB start year", required: false, default: "2020"}
      mlb_end_year: {description: "MLB end year", required: false, default: "2026"}
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/**", "results/**", "research_state.json", "research_history.json", "research_plan.json"]

permissions:
  contents: write
  actions: write

concurrency:
  group: baseball-production-v5
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Source and syntax preflight
        run: |
          set -euo pipefail
          python source_quality_gate.py
          python repair_npb_syntax.py
          python npb_runtime_patch.py
          python npb_official_schedule_patch.py
          python npb_quality_runtime_patch.py
          python baseball_backtest_runtime_patch.py
          python baseball_production_runtime_patch.py
          python baseball_mlb_score_hilo_patch.py
          python baseball_quality_runtime_patch.py
          python -m py_compile npb_multi_source.py baseball_backtest.py npb_runtime_patch.py npb_official_schedule_patch.py npb_quality_runtime_patch.py baseball_backtest_runtime_patch.py baseball_production_runtime_patch.py baseball_mlb_score_hilo_patch.py baseball_quality_runtime_patch.py repair_npb_syntax.py backtest_audit.py source_quality_gate.py
          python backtest_audit.py || true
      - name: Collect and backtest NPB
        env:
          NPB_START_YEAR: ${{ inputs.npb_start_year || '1990' }}
          NPB_END_YEAR: ${{ inputs.npb_end_year || '2026' }}
          NPB_DOWNLOAD_WORKERS: "4"
          NPB_MIN_STARTER_LINE_COVERAGE: "70"
          NPB_MIN_STARTER_COVERAGE: "70"
          NPB_COLLECTION_BUDGET_SEC: "5400"
          NPB_COLLECTION_SAFETY_SEC: "300"
          BASEBALL_TIME_BUDGET_SEC: "5400"
        run: |
          set -euo pipefail
          mkdir -p data results
          python npb_multi_source.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/checkpoints/npb_collection_status.json')
          if not p.exists(): raise SystemExit('NPB collection status missing')
          s=json.loads(p.read_text())
          print('[NPB]', s.get('complete'), s.get('aggregate_games'))
          if s.get('complete'):
              raise SystemExit(0)
          print('[NPB] checkpoint retained; collection incomplete on this pass')
          raise SystemExit(2)
          PY
        continue-on-error: true
      - name: Run NPB OOS when complete
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/checkpoints/npb_collection_status.json ] && python - <<'PY'
          import json
          from pathlib import Path
          print(bool(json.loads(Path('data/checkpoints/npb_collection_status.json').read_text()).get('complete')))
          PY
          then python baseball_backtest.py --npb-only --data-dir data; fi
      - name: Run MLB starter-enriched OOS backtest
        env:
          BASEBALL_TIME_BUDGET_SEC: "5400"
          MLB_ENRICH_STARTERS: "1"
          MLB_MIN_STARTER_COVERAGE: "90"
        run: |
          set -euo pipefail
          mkdir -p data results
          python baseball_backtest.py --mlb-only --data-dir data --mlb-start "${{ inputs.mlb_start_year || '2020' }}" --mlb-end "${{ inputs.mlb_end_year || '2026' }}"
      - name: Validate outputs
        run: |
          set -euo pipefail
          find results -maxdepth 2 -type f -print | head -100
          test -d results
      - name: Persist results
        if: always()
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ results/ npb_multi_source.py
          if git diff --cached --quiet; then echo '[COMMIT] no generated changes'; else git commit -m 'Persist Baseball production state'; git push origin HEAD:main; fi
