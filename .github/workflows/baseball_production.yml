name: Baseball Production Backtest
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Validate Code Syntax
    types: [completed]
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  actions: read
concurrency:
  group: baseball-production
  cancel-in-progress: true
env:
  PYTHONUNBUFFERED: "1"
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify validation SHA matches current main
        id: sha_gate
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "[VALIDATION GATE] PASS manual/scheduled execution"
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "[VALIDATION GATE] FAIL-CLOSED: upstream validation conclusion=${{ github.event.workflow_run.conclusion }}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$CURRENT_SHA" != "$VALIDATED_SHA" ]; then
            echo "[VALIDATION GATE] DEFERRED: current_main=$CURRENT_SHA validated=$VALIDATED_SHA"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[VALIDATION GATE] PASS sha=$CURRENT_SHA event=$EVENT_NAME"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Require successful validation for current main
        if: steps.sha_gate.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          export CURRENT_SHA
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, sys
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          api=os.environ["GITHUB_API_URL"].rstrip("/")
          sha=os.environ["CURRENT_SHA"]
          q=urllib.parse.urlencode({"branch":"main","per_page":"50"})
          req=urllib.request.Request(
              f"{api}/repos/{repo}/actions/runs?{q}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"Baseball-Production-Validation-Gate",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              payload=json.load(resp)
          for row in payload.get("workflow_runs", []):
              if row.get("name")=="Validate Code Syntax" and row.get("head_sha")==sha and row.get("conclusion")=="success":
                  print(f"[VALIDATION GATE] PASS sha={sha} run={row.get('id')}")
                  break
          else:
              print(f"[VALIDATION GATE] FAIL: no successful Validate Code Syntax run for sha={sha}")
              sys.exit(21)
          PY
      - name: Hosted runner health gate
        if: steps.sha_gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          if [ "${free_kb:-0}" -lt 5242880 ]; then
            echo '[HEALTH] FAIL: less than 5 GiB free on workspace filesystem'
            exit 20
          fi
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --max-time 20 https://api.github.com/rate_limit >/dev/null
          echo '[HEALTH] GitHub HTTPS PASS'
          curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --retry-all-errors --max-time 20 https://statsapi.mlb.com/api/v1/sports/1 >/dev/null
          echo '[HEALTH] MLB Stats API HTTPS PASS'
      - name: Setup Python
        if: success() && steps.sha_gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/baseball-production-venv"
          STAMP="$VENV/.requirements.sha256"
          REQ_HASH="$(shasum -a 256 requirements.txt | awk '{print $1}')"
          retry() {
            local attempts=4 delay=5 n=1
            while true; do
              "$@" && return 0
              if [ "$n" -ge "$attempts" ]; then return 1; fi
              echo "[RETRY] command failed; retrying in ${delay}s ($n/$attempts)"
              sleep "$delay"
              n=$((n+1)); delay=$((delay*2))
            done
          }
          STAMP_CONTENT=""
          if [ -f "$STAMP" ]; then
            STAMP_CONTENT="$(cat "$STAMP")"
          fi
          if [ ! -x "$VENV/bin/python" ] || [ ! -f "$STAMP" ] || [ "$STAMP_CONTENT" != "$REQ_HASH" ]; then
            echo "[DEPS] Creating/updating persistent production venv"
            rm -rf "$VENV"
            mkdir -p "$(dirname "$VENV")"
            python3 -m venv "$VENV"
            retry "$VENV/bin/python" -m pip install --disable-pip-version-check --upgrade pip
            retry "$VENV/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
            printf '%s' "$REQ_HASH" > "$STAMP"
          else
            echo "[DEPS] Reusing persistent production venv; requirements unchanged"
          fi
          "$VENV/bin/python" - <<'PY'
          import numpy,pandas,sklearn,requests
          print('[DEPS] core imports OK')
          PY
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Preflight and integrity gate
        if: success() && steps.sha_gate.outputs.ok == 'true'
        run: |
          set -euo pipefail
          python source_quality_gate.py
          if [ -f repair_npb_syntax.py ]; then
            python repair_npb_syntax.py
          else
            echo '[PREFLIGHT] repair_npb_syntax.py not present; repair step skipped safely'
          fi
          python -m py_compile npb_multi_source.py baseball_backtest.py baseball_backtest_runtime_patch.py source_quality_gate.py backtest_audit_v2.py production_integrity_gate.py production_data_quality_gate.py
          apply_patch_safely() { local patch="$1"; test -f "$patch" || { echo "[PATCH] missing: $patch"; return 1; }; cp baseball_backtest.py /tmp/baseball_backtest_pre_patch.py; if python "$patch" && python -m py_compile baseball_backtest.py; then echo "[PATCH] $patch accepted"; else cp /tmp/baseball_backtest_pre_patch.py baseball_backtest.py; return 1; fi; }
          apply_patch_safely npb_runtime_patch.py
          apply_patch_safely npb_official_schedule_patch.py
          apply_patch_safely npb_quality_runtime_patch.py
          apply_patch_safely baseball_backtest_runtime_patch.py
          apply_patch_safely baseball_production_runtime_patch.py
          apply_patch_safely baseball_mlb_score_hilo_patch.py
          apply_patch_safely baseball_quality_runtime_patch.py
          python -m py_compile npb_multi_source.py baseball_backtest.py baseball_backtest_runtime_patch.py npb_runtime_patch.py npb_official_schedule_patch.py npb_quality_runtime_patch.py baseball_production_runtime_patch.py baseball_mlb_score_hilo_patch.py baseball_quality_runtime_patch.py backtest_audit_v2.py source_quality_gate.py production_integrity_gate.py production_data_quality_gate.py
      - name: NPB readiness gate
        if: success() && steps.sha_gate.outputs.ok == 'true'
        id: npb_ready
        run: |
          set -euo pipefail
          mkdir -p data results
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/checkpoints/npb_collection_status.json')
          ghout=Path(os.environ['GITHUB_OUTPUT'])
          if not p.exists():
              print('[NPB READY] DEFERRED: collection status is missing')
              ghout.write_text('ready=false\n',encoding='utf-8')
              raise SystemExit(0)
          s=json.loads(p.read_text(encoding='utf-8'))
          complete=bool(s.get('complete',False))
          games=int(s.get('aggregate_games') or 0)
          if not complete or games < 200:
              print(f'[NPB READY] DEFERRED complete={complete} aggregate_games={games}')
              ghout.write_text('ready=false\n',encoding='utf-8')
              raise SystemExit(0)
          print(f'[NPB READY] PASS complete={complete} aggregate_games={games}')
          ghout.write_text('ready=true\n',encoding='utf-8')
          PY
      - name: MLB readiness gate
        if: success() && steps.sha_gate.outputs.ok == 'true'
        id: mlb_ready
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('data/checkpoints/mlb_collection_status.json')
          ghout=Path(os.environ['GITHUB_OUTPUT'])
          if not p.exists():
              print('[MLB READY] DEFERRED: collection status is missing')
              ghout.write_text('ready=false\n',encoding='utf-8')
              raise SystemExit(0)
          s=json.loads(p.read_text(encoding='utf-8'))
          complete=bool(s.get('complete',False))
          games=int(s.get('aggregate_games') or 0)
          if not complete or games < 100:
              print(f'[MLB READY] DEFERRED complete={complete} aggregate_games={games}')
              ghout.write_text('ready=false\n',encoding='utf-8')
              raise SystemExit(0)
          print(f'[MLB READY] PASS complete={complete} aggregate_games={games}')
          ghout.write_text('ready=true\n',encoding='utf-8')
          PY
      - name: NPB chronological OOS
        if: success() && steps.sha_gate.outputs.ok == 'true' && steps.npb_ready.outputs.ready == 'true'
        env:
          BASEBALL_TIME_BUDGET_SEC: "3600"
        run: python baseball_backtest.py --npb-only --data-dir data
      - name: MLB chronological OOS
        if: success() && steps.sha_gate.outputs.ok == 'true' && steps.mlb_ready.outputs.ready == 'true'
        env:
          BASEBALL_TIME_BUDGET_SEC: "3600"
          MLB_ENRICH_STARTERS: "1"
          MLB_MIN_STARTER_COVERAGE: "90"
        run: python baseball_backtest.py --mlb-only --data-dir data --mlb-start 2020 --mlb-end 2026
      - name: Validate OOS predictions before any state write
        if: success() && steps.sha_gate.outputs.ok == 'true' && (steps.npb_ready.outputs.ready == 'true' || steps.mlb_ready.outputs.ready == 'true')
        run: |
          set -euo pipefail
          mkdir -p data results
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path('data/checkpoints/mlb_collection_status.json')
          out=Path('results/production_deferred.json')
          ghout=Path(os.environ['GITHUB_OUTPUT'])
          if not p.exists():
              payload={"status":"DEFERRED","reason":"MLB source acquisition has not produced a collection status yet"}
              out.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
              print('[MLB READY] DEFERRED: collection status is missing')
              ghout.write_text('ready=false\n',encoding='utf-8')
              raise SystemExit(0)
          s=json.loads(p.read_text(encoding='utf-8'))
          complete=bool(s.get('complete',False))
          games=int(s.get('aggregate_games') or 0)
          if not complete or games < 100:
              payload={"status":"DEFERRED","reason":"MLB historical acquisition incomplete","complete":complete,"aggregate_games":games}
              out.write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
              print(f'[MLB READY] DEFERRED complete={complete} aggregate_games={games}')
              ghout.write_text('ready=false\n',encoding='utf-8')
              raise SystemExit(0)
          print(f'[MLB READY] PASS complete={complete} aggregate_games={games}')
          ghout.write_text('ready=true\n',encoding='utf-8')
          PY
      - name: Upload MLB deferred status
        if: success() && steps.sha_gate.outputs.ok == 'true' && steps.mlb_ready.outputs.ready != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-production-deferred-${{ github.run_id }}
          path: results/production_deferred.json
          if-no-files-found: error
          retention-days: 7
      - name: MLB data acquisition, starter quality gate and chronological OOS
        if: success() && steps.sha_gate.outputs.ok == 'true' && steps.mlb_ready.outputs.ready == 'true'
        env:
          BASEBALL_TIME_BUDGET_SEC: "3600"
          MLB_ENRICH_STARTERS: "1"
          MLB_MIN_STARTER_COVERAGE: "90"
        run: python baseball_backtest.py --mlb-only --data-dir data --mlb-start 2020 --mlb-end 2026
      - name: Validate OOS predictions before any state write
        if: success() && steps.sha_gate.outputs.ok == 'true' && steps.mlb_ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          find results -maxdepth 2 -type f -print | head -100
          test -d results
          test -n "$(find results -type f -print -quit)"
          python - <<'PY'
          from pathlib import Path
          import csv
          files=[p for p in Path('results').rglob('*') if p.is_file() and p.stat().st_size>0]
          if not files: raise SystemExit('no non-empty result artifacts')
          csvs=[p for p in files if p.suffix.lower()=='.csv']
          if not csvs: raise SystemExit('no CSV prediction/backtest result produced')
          for p in csvs:
              with p.open('r',encoding='utf-8',errors='replace',newline='') as f: rows=sum(1 for _ in csv.reader(f))
              if rows < 2: raise SystemExit(f'result CSV has no data rows: {p}')
          print(f'[OOS VALIDATION] PASS nonempty_files={len(files)} csv_files={len(csvs)}')
          PY
          python backtest_audit_v2.py
          python production_data_quality_gate.py
          python production_integrity_gate.py
      - name: Upload verified state artifact
        if: success() && steps.sha_gate.outputs.ok == 'true' && steps.mlb_ready.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-production-state-${{ github.run_id }}
          path: |
            data/
            results/
            npb_multi_source.py
            production_run_manifest.json
          if-no-files-found: error
          retention-days: 90
