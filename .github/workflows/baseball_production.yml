name: Baseball Production Backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**", "results/**", "research_state.json", "research_history.json", "research_plan.json", "npb_multi_source.py", "exact_parallel/**", ".github/workflows/baseball-exact-parallel-verify.yml"]
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: baseball-production
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  production:
    runs-on: [self-hosted, macOS, X64, baseball]
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/baseball-production-venv"
          python3 -m venv "$VENV"
          REQ_HASH="$(shasum -a 256 requirements.txt | awk '{print $1}')"
          echo "[DEPS] requirements_sha256=$REQ_HASH"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install -r requirements.txt
          "$VENV/bin/python" - <<'PY'
          import numpy,pandas,sklearn,requests
          print('[DEPS] core imports OK')
          PY
          echo "$VENV/bin" >> "$GITHUB_PATH"
      - name: Preflight and integrity gate
        run: |
          set -euo pipefail
          python source_quality_gate.py
          python repair_npb_syntax.py
          python -m py_compile npb_multi_source.py baseball_backtest.py baseball_backtest_runtime_patch.py repair_npb_syntax.py source_quality_gate.py backtest_audit.py
          apply_patch_safely() {
            local patch="$1"
            cp baseball_backtest.py /tmp/baseball_backtest_pre_patch.py
            if python "$patch" && python -m py_compile baseball_backtest.py; then echo "[PATCH] $patch accepted"; else cp /tmp/baseball_backtest_pre_patch.py baseball_backtest.py; return 1; fi
          }
          apply_patch_safely npb_runtime_patch.py
          apply_patch_safely npb_official_schedule_patch.py
          apply_patch_safely npb_quality_runtime_patch.py
          apply_patch_safely baseball_backtest_runtime_patch.py
          apply_patch_safely baseball_production_runtime_patch.py
          apply_patch_safely baseball_mlb_score_hilo_patch.py
          apply_patch_safely baseball_quality_runtime_patch.py
          python -m py_compile npb_multi_source.py baseball_backtest.py baseball_backtest_runtime_patch.py npb_runtime_patch.py npb_official_schedule_patch.py npb_quality_runtime_patch.py baseball_production_runtime_patch.py baseball_mlb_score_hilo_patch.py baseball_quality_runtime_patch.py repair_npb_syntax.py backtest_audit.py source_quality_gate.py
      - name: NPB data acquisition, quality gate and chronological OOS
        env:
          NPB_START_YEAR: "2017"
          NPB_END_YEAR: "2026"
          NPB_DOWNLOAD_WORKERS: "4"
          NPB_MIN_STARTER_LINE_COVERAGE: "70"
          NPB_MIN_STARTER_COVERAGE: "70"
          NPB_COLLECTION_BUDGET_SEC: "3600"
          NPB_COLLECTION_SAFETY_SEC: "300"
          BASEBALL_TIME_BUDGET_SEC: "3600"
        run: |
          set -euo pipefail
          mkdir -p data results
          python npb_multi_source.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/checkpoints/npb_collection_status.json')
          if not p.exists(): raise SystemExit('NPB collection status missing')
          s=json.loads(p.read_text()); print('[NPB STATUS]',s.get('complete'),s.get('aggregate_games'))
          if not s.get('complete',False): raise SystemExit(2)
          if not s.get('aggregate_games'): raise SystemExit('NPB quality gate: zero aggregate games')
          PY
          python baseball_backtest.py --npb-only --data-dir data
      - name: MLB data acquisition, starter quality gate and chronological OOS
        env:
          BASEBALL_TIME_BUDGET_SEC: "3600"
          MLB_ENRICH_STARTERS: "1"
          MLB_MIN_STARTER_COVERAGE: "90"
        run: python baseball_backtest.py --mlb-only --data-dir data --mlb-start 2020 --mlb-end 2026
      - name: Validate OOS predictions before any state write
        run: |
          set -euo pipefail
          find results -maxdepth 2 -type f -print | head -100
          test -d results
          test -n "$(find results -type f -print -quit)"
          python - <<'PY'
          from pathlib import Path
          import csv
          files=[p for p in Path('results').rglob('*') if p.is_file() and p.stat().st_size>0]
          if not files: raise SystemExit('no non-empty result artifacts')
          csvs=[p for p in files if p.suffix.lower()=='.csv']
          if not csvs: raise SystemExit('no CSV prediction/backtest result produced')
          for p in csvs:
              with p.open('r',encoding='utf-8',errors='replace',newline='') as f:
                  rows=sum(1 for _ in csv.reader(f))
              if rows < 2: raise SystemExit(f'result CSV has no data rows: {p}')
          print(f'[OOS VALIDATION] PASS nonempty_files={len(files)} csv_files={len(csvs)}')
          PY
      - name: Upload verified state artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-production-state-${{ github.run_id }}
          path: |
            data/
            results/
            npb_multi_source.py
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure diagnostics without touching production state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-production-failure-${{ github.run_id }}
          path: |
            data/
            results/
            npb_multi_source.py
          if-no-files-found: ignore
          retention-days: 30
      - name: Persist verified state atomically
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data results
          git add -A data results npb_multi_source.py
          if git diff --cached --quiet; then echo '[COMMIT] no verified state changes'; exit 0; fi
          git commit -m 'Persist verified Baseball production state'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then echo "[PERSIST] verified state push succeeded on attempt $attempt"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo '[PERSIST] verified state push failed after 5 attempts'; exit 1
