name: Baseball Research AI Loop

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: baseball-research-ai
  cancel-in-progress: false

jobs:
  research:
    name: Automated model research and evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASEBALL_TIME_BUDGET_SEC: "3600"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run audit
        run: python backtest_audit.py
      - name: Run available evaluation pipeline
        run: |
          mkdir -p research_results
          python baseball_backtest.py --mlb-only --data-dir data || true
          python baseball_backtest.py --npb-only --data-dir data || true
      - name: Save research log
        run: |
          mkdir -p research_results
          date -u > research_results/last_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_results
          git commit -m "Update baseball research loop log" || true
          git push || true
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseball-research-results
          path: research_results/
          retention-days: 30
