name: Baseball Parallel NPB Source Acquisition

on:
  workflow_dispatch:
  push:
    paths:
      - 'control/baseball-acquisition-trigger.txt'
  schedule:
    - cron: '14 11 * * *'

permissions:
  contents: write

concurrency:
  group: baseball-parallel-npb-acquisition
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  npb:
    name: NPB full-scope resumable acquisition
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Health and setup
        run: |
          set -euo pipefail
          python3 --version
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --max-time 20 https://npb.jp/ >/dev/null
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install -r requirements.txt
      - name: Preflight
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m py_compile npb_multi_source.py npb_runtime_patch.py source_quality_gate.py
          python source_quality_gate.py
          python npb_runtime_patch.py
      - name: NPB resumable acquisition
        id: acquire
        continue-on-error: true
        env:
          NPB_START_YEAR: "2017"
          NPB_END_YEAR: "2026"
          NPB_DOWNLOAD_WORKERS: "12"
          NPB_LIGHT_ENRICH: "1"
          NPB_MIN_STARTER_LINE_COVERAGE: "70"
          NPB_REQUIRED_START_YEAR: "2020"
          NPB_MIN_STARTER_COVERAGE: "70"
          NPB_COLLECTION_BUDGET_SEC: "6000"
          NPB_COLLECTION_SAFETY_SEC: "600"
          BASEBALL_TIME_BUDGET_SEC: "6000"
        run: . .venv/bin/activate && python npb_multi_source.py
      - name: Persist NPB checkpoint on failure
        if: steps.acquire.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/checkpoints data/npb_games data/weather data/source_coverage.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Checkpoint parallel NPB acquisition'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            if git rebase --abort 2>/dev/null; then
              :
            else
              rc=$?
              if [ "$rc" -ne 128 ]; then exit "$rc"; fi
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Final NPB outcome
        if: always()
        env:
          ACQUIRE_OUTCOME: "${{ steps.acquire.outcome }}"
        run: |
          set -euo pipefail
          test "$ACQUIRE_OUTCOME" = success
      - name: Persist NPB data
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/checkpoints data/npb_games data/weather data/source_coverage.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update parallel NPB source data'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            if git rebase --abort 2>/dev/null; then
              :
            else
              rc=$?
              if [ "$rc" -ne 128 ]; then exit "$rc"; fi
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Upload NPB diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseball-npb-acquisition-${{ github.run_id }}
          path: |
            data/checkpoints/
            data/npb_games/
            data/weather/
            data/source_coverage.csv
          if-no-files-found: ignore
          retention-days: 30
