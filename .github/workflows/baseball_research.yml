name: Baseball Autonomous Research

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: baseball-autonomous-research
  cancel-in-progress: false

env:
  BASEBALL_TIME_BUDGET_SEC: "3600"
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    name: Analyze OOS results and update research state
    runs-on: [self-hosted, macOS]
    timeout-minutes: 70
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_RESEARCH_MODEL: gpt-5.6-luna
    steps:
      - name: Ensure GitHub CLI is available
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            command -v brew >/dev/null 2>&1 || { echo '[RESEARCH] Homebrew is required to install GitHub CLI'; exit 1; }
            brew install gh
          fi
          gh --version
      - name: Checkout latest main state
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - name: Verify Mac worker
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          python3 --version
      - name: Verify OpenAI secret is available
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY GitHub Secret is not configured"; exit 1; }
          echo "OpenAI API secret detected; value is intentionally not printed."
      - name: Prepare isolated Python
        run: |
          set -euo pipefail
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate source policy
        run: . .venv/bin/activate && python source_quality_gate.py
      - name: Preflight
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m py_compile research/research_loop.py research/openai_research_advisor.py backtest_audit.py source_quality_gate.py
          python backtest_audit.py
      - name: Run autonomous research controller with bounded retries
        run: |
          set -euo pipefail
          . .venv/bin/activate
          for attempt in 1 2 3; do
            echo "[RESEARCH] controller attempt ${attempt}/3"
            if python research/research_loop.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "[RESEARCH] all controller retries failed"
          exit 1
      - name: Generate OpenAI research advisory
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python research/openai_research_advisor.py
          python -m json.tool research_ai_advice.json >/dev/null
      - name: Validate research artifacts
        run: |
          set -euo pipefail
          python -m json.tool research_state.json >/dev/null
          python -m json.tool research_history.json >/dev/null
          python -m json.tool research_plan.json >/dev/null
          python -m json.tool research_ai_advice.json >/dev/null
      - name: Persist research state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_state.json research_history.json research_plan.json research_ai_advice.json
          if git diff --cached --quiet; then echo "[RESEARCH] state unchanged"; else git commit -m "Update autonomous baseball research state"; git push; fi
      - name: Start next autonomous production cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh workflow run "Baseball Production Backtest" --repo "${GITHUB_REPOSITORY}" --ref main; then
              echo "[RESEARCH] next Production cycle dispatched"
              exit 0
            fi
            sleep 10
          done
          echo "[RESEARCH] failed to dispatch next Production cycle"
          exit 1
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-autonomous-research
          path: |
            research_state.json
            research_history.json
            research_plan.json
            research_ai_advice.json
          if-no-files-found: warn
          retention-days: 30
