name: Baseball Autonomous Research

on:
  workflow_run:
    workflows: ["Baseball Mac Compute Research"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: baseball-autonomous-research
  cancel-in-progress: false

jobs:
  research:
    name: Analyze OOS results and update research state
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASEBALL_TIME_BUDGET_SEC: "3600"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout latest main state
        uses: actions/checkout@v5
        with:
          ref: main
          clean: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate source policy
        run: python source_quality_gate.py

      - name: Preflight
        run: |
          set -euo pipefail
          python -m py_compile research/research_loop.py backtest_audit.py source_quality_gate.py
          python backtest_audit.py

      - name: Run autonomous research controller with bounded retries
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "[RESEARCH] controller attempt ${attempt}/3"
            if python research/research_loop.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "[RESEARCH] all controller retries failed"
          exit 1

      - name: Validate research artifacts
        run: |
          set -euo pipefail
          python -m json.tool research_state.json >/dev/null
          python -m json.tool research_history.json >/dev/null
          python -m json.tool research_plan.json >/dev/null

      - name: Persist research state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_state.json research_history.json research_plan.json
          if git diff --cached --quiet; then
            echo "[RESEARCH] state unchanged"
          else
            git commit -m "Update autonomous baseball research state"
            git push
          fi

      - name: Start next autonomous production cycle
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 5 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/baseball_production.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "[RESEARCH] next Production cycle dispatched"

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-autonomous-research
          path: |
            research_state.json
            research_history.json
            research_plan.json
          if-no-files-found: warn
          retention-days: 30
