name: Baseball Autonomous Research

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseball-autonomous-research
  cancel-in-progress: false

env:
  BASEBALL_TIME_BUDGET_SEC: "3600"
  PYTHONUNBUFFERED: "1"

jobs:
  research:
    name: Analyze OOS results and update research state
    runs-on: [self-hosted, macOS, X64, baseball]
    timeout-minutes: 70
    steps:
      - name: Checkout latest main state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          clean: true
          persist-credentials: false
      - name: Mac runtime health gate
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          echo '[HEALTH] Disk:'; df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          free_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')"
          if [ "${free_kb:-0}" -lt 10485760 ]; then echo '[HEALTH] FAIL: less than 10 GiB free'; exit 20; fi
          echo '[HEALTH] Memory:'; vm_stat | head -20 || true
          echo '[HEALTH] Load:'; uptime
          curl --fail --silent --show-error --location --max-time 20 https://api.github.com/rate_limit >/dev/null
          echo '[HEALTH] GitHub HTTPS PASS'
      - name: Verify Mac worker
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          python3 --version
          pgrep -af 'Runner.Listener' || true
      - name: Verify OpenAI secret is available
        run: |
          set -euo pipefail
          test -n "${OPENAI_API_KEY:-}" || { echo "OPENAI_API_KEY GitHub Secret is not configured"; exit 1; }
          echo "OpenAI API secret detected; value is intentionally not printed."
      - name: Prepare isolated Python
        run: |
          set -euo pipefail
          rm -rf .venv
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate source policy
        run: . .venv/bin/activate && python source_quality_gate.py
      - name: Preflight
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m py_compile research/research_loop.py research/openai_research_advisor.py backtest_audit.py source_quality_gate.py
          python backtest_audit.py
      - name: Run autonomous research controller with bounded retries
        run: |
          set -euo pipefail
          . .venv/bin/activate
          for attempt in 1 2 3; do
            echo "[RESEARCH] controller attempt ${attempt}/3"
            if python research/research_loop.py; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          echo "[RESEARCH] all controller retries failed"
          exit 1
      - name: Generate OpenAI research advisory
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python research/openai_research_advisor.py
          python -m json.tool research_ai_advice.json >/dev/null
      - name: Validate research artifacts
        run: |
          set -euo pipefail
          python -m json.tool research_state.json >/dev/null
          python -m json.tool research_history.json >/dev/null
          python -m json.tool research_plan.json >/dev/null
          python -m json.tool research_ai_advice.json >/dev/null
          python - <<'PY'
          import json
          a=json.load(open('research_ai_advice.json',encoding='utf-8'))
          assert a.get('advisory_only') is True
          assert a.get('source_policy') == 'prior_rows_only'
          print('[RESEARCH] advisory-only promotion safety gate: PASS')
          PY
      - name: Persist research state with conflict recovery
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_state.json research_history.json research_plan.json research_ai_advice.json
          if git diff --cached --quiet; then echo "[RESEARCH] state unchanged"; exit 0; fi
          git commit -m "Update autonomous baseball research state"
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then echo "[RESEARCH] state persisted on attempt $attempt"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "[RESEARCH] state push failed after 5 attempts"
          exit 1
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-autonomous-research-${{ github.run_id }}
          path: |
            research_state.json
            research_history.json
            research_plan.json
            research_ai_advice.json
          if-no-files-found: warn
          retention-days: 30
