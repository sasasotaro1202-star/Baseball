name: Baseball Autonomous Research

on:
  workflow_run:
    workflows: ["Baseball Production Backtest", "Baseball Mac Compute Research"]
    types: [completed]
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: baseball-autonomous-research
  cancel-in-progress: false

jobs:
  research:
    name: Analyze OOS results and update research state
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASEBALL_TIME_BUDGET_SEC: "3600"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run autonomous research controller
        run: |
          set -euo pipefail
          python research/research_loop.py
      - name: Validate research artifacts
        run: |
          set -euo pipefail
          python -m json.tool research_state.json >/dev/null
          python -m json.tool research_history.json >/dev/null
          python -m json.tool research_plan.json >/dev/null
      - name: Persist research state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_state.json research_history.json research_plan.json
          if git diff --cached --quiet; then
            echo "[RESEARCH] state unchanged"
          else
            git commit -m "Update autonomous baseball research state"
            git push
          fi
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-autonomous-research
          path: |
            research_state.json
            research_history.json
            research_plan.json
          if-no-files-found: warn
          retention-days: 30
