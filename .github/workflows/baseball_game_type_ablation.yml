name: Baseball NPB Game-Type OOS Ablation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Baseball NPB Source Acquisition
    types: [completed]
  schedule:
    - cron: "31 */6 * * *"

permissions:
  contents: read

concurrency:
  group: baseball-game-type-ablation
  cancel-in-progress: false

jobs:
  ablation:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 140
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - variant: baseline
            training: regular,interleague
          - variant: +climax
            training: regular,interleague,climax
          - variant: +japan_series
            training: regular,interleague,japan_series
          - variant: +allstar
            training: regular,interleague,allstar
          - variant: +special
            training: regular,interleague,special
          - variant: +postseason
            training: regular,interleague,climax,japan_series
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify NPB data readiness
        id: ready
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd

          aggregate = Path("data/npb_multi_source_games_all.csv")
          files = [aggregate] if aggregate.exists() else sorted(Path("data/npb_games").glob("*_multi_source_pbp.csv"))
          if not files:
              print('[GAME-TYPE ABLATION] DEFERRED: no NPB multi-source dataset is available')
              print("ready=false")
              raise SystemExit

          frames = []
          for path in files:
              try:
                  frame = pd.read_csv(path, usecols=lambda c: c in {"game_id","npb_game_category","game_type"})
              except Exception:
                  continue
              if "game_id" in frame:
                  frames.append(frame)
          if not frames:
              print("ready=false")
              raise SystemExit
          d = pd.concat(frames, ignore_index=True, sort=False).drop_duplicates("game_id")
          if len(d) < 200:
              print(f"[GAME-TYPE ABLATION] DEFERRED: rows={len(d)}")
              print("ready=false")
              raise SystemExit
          cats=d.get("npb_game_category",pd.Series(dtype=str)).fillna("unknown").value_counts()
          print(f"[GAME-TYPE ABLATION] rows={len(d)} files={len(files)} categories={cats.to_dict()}")
          print("ready=true")
          PY
      - name: Setup Python
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Preflight and run OOS variant
        if: steps.ready.outputs.ready == 'true'
        env:
          BASEBALL_TIME_BUDGET_SEC: "900"
          NPB_TRAINING_GAME_CATEGORIES: ${{ matrix.training }}
          NPB_EVALUATION_GAME_CATEGORIES: "regular,interleague,climax,japan_series,allstar,special"
          BASEBALL_MATCHDAY_SHADOW: "0"
        run: |
          set -euo pipefail
          python -m py_compile npb_game_type.py baseball_backtest.py research/npb_game_type_ablation.py
          python baseball_backtest.py --npb-only --data-dir data
          python research/npb_game_type_ablation.py --variant "${{ matrix.variant }}"
      - name: Emit explicit deferred artifact
        if: steps.ready.outputs.ready != 'true'
        run: |
          mkdir -p results
          printf '%s\n' '{"schema_version":1,"variant":"${{ matrix.variant }}","status":"DEFERRED","reason":"NPB aggregate dataset not available","promotion_auto":false}' > results/npb_game_type_ablation_summary.json
      - name: Validate result schema
        run: |
          set -euo pipefail
          python -m json.tool results/npb_game_type_ablation_summary.json >/dev/null
          test -s results/npb_game_type_ablation_summary.json
      - name: Upload variant
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-game-type-ablation-${{ matrix.variant }}
          path: |
            results/npb_game_type_ablation_summary.json
            results/npb_backtest_summary.csv
            results/npb_game_type_metrics.csv
          if-no-files-found: ignore
          retention-days: 30

  compare:
    needs: ablation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download all OOS variant artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      - name: Setup Python for comparison
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/compare-venv"
          "$RUNNER_TEMP/compare-venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt
          echo "$RUNNER_TEMP/compare-venv/bin" >> "$GITHUB_PATH"
        with:
          pattern: baseball-game-type-ablation-*
          path: ablation_artifacts
          merge-multiple: false
      - name: Compare variants
        run: |
          set -euo pipefail
          python research/compare_game_type_ablation.py --root ablation_artifacts
          python -m json.tool results/npb_game_type_ablation_comparison.json >/dev/null
      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-game-type-ablation-comparison
          path: results/npb_game_type_ablation_comparison.json
          if-no-files-found: error
          retention-days: 30
