name: NPB Data Acquisition (2018-2025)

on:
  workflow_dispatch:

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-parallel.txt
      - name: Acquire NPB schedule data (armstjc/Nippon-Baseball-Data-Repository)
        run: |
          python -m parallel.acquire_npb
      - uses: actions/upload-artifact@v4
        with:
          name: npb-acquisition-report
          path: artifacts/npb_acquisition_report.json
      - name: Commit acquired data back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/npb
          git diff --staged --quiet || git commit -m "Auto-update: NPB data acquisition"
          git push
