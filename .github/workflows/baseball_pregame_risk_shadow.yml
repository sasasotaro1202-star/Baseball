name: Baseball Pregame Risk Shadow

on:
  push:
    branches:
      - research/pregame-risk-shadow
    paths:
      - 'research/pregame_risk_shadow.py'
      - 'tests/test_pregame_risk_shadow.py'
      - '.github/workflows/baseball_pregame_risk_shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-pregame-risk-shadow
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install scientific dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'pandas>=2,<3' 'pytest>=8,<10'
      - name: Syntax and unit tests
        run: |
          set -euo pipefail
          python -m py_compile research/pregame_risk_shadow.py tests/test_pregame_risk_shadow.py
          python -m pytest -q tests/test_pregame_risk_shadow.py
      - name: Research-only integrity check
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('research/pregame_risk_shadow.py').read_text(encoding='utf-8')
          required = [
              'research_only',
              'DIAGNOSTIC_ONLY_UNCALIBRATED',
              'probabilities_modified',
              'routing_modified',
              'promotion_auto',
          ]
          for marker in required:
              if marker not in p:
                  raise SystemExit(f'missing fail-safe marker: {marker}')
          PY
