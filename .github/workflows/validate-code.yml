name: Validate Code Syntax
on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: baseball-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if pip install --disable-pip-version-check -r requirements.txt && python -m pip install --disable-pip-version-check 'pytest>=8,<9'; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
          exit 1
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml",".github/workflows/*.yaml"].flatten.sort.each { |p| YAML.load_file(p); puts "[YAML] PASS #{p}" }'
      - name: Validate Python syntax
        run: |
          python -m py_compile run.py
          python -m py_compile elo_baseline_all.py
          python -m py_compile pipelines/collect.py
          python -m py_compile source_quality_gate.py
          python -m py_compile production_integrity_gate.py
          python -m py_compile baseball_backtest.py
          python -m py_compile npb_multi_source.py
          python -m py_compile npb_game_type.py
          python -m py_compile mlb_game_type.py
          python -m py_compile international_game_type.py
          python -m py_compile mlb_incremental_acquire.py
          python -m py_compile npb_runtime_patch.py
          python -m py_compile npb_official_schedule_patch.py
          python -m py_compile npb_quality_runtime_patch.py
          python -m py_compile baseball_backtest_runtime_patch.py
          python -m py_compile baseball_production_runtime_patch.py
          python -m py_compile baseball_quality_runtime_patch.py
          python -m py_compile baseball_mlb_score_hilo_patch.py
          python -m py_compile backtest_audit_v2.py
          python -m py_compile research/research_loop.py
          python -m py_compile research/openai_research_advisor.py
          python -m py_compile research/frozen_holdout_gate.py
          python -m py_compile research/drift_uncertainty_routing.py
          python -m py_compile research/routing_oos_replay.py
          python -m py_compile research/routing_acceptance_gate.py
          python -m py_compile production_matchday_intelligence.py
          python -m py_compile research/conformal_uncertainty.py
          python -m research.conformal_uncertainty
          python -m py_compile research/matchday_intelligence.py
          python -m py_compile research/matchday_policy.py
          python -m py_compile research/matchday_policy_learning.py
          python -m py_compile research/matchday_replay.py
          python -m py_compile research/matchday_settle.py
          python -m py_compile research/matchday_change_ledger.py
          python -m py_compile research/matchday_effect_dataset.py
          python -m py_compile research/matchday_effect_fit.py
          python -m py_compile research/matchday_reforecast.py
          python -m py_compile research/matchday_integrated_acceptance_gate.py
          python -m py_compile production_matchday_intelligence.py
          python -m py_compile research/ci_runtime_smoke.py
          python -m py_compile research/calibration_oos.py
          python -m py_compile research/negative_binomial_score_oos.py
          python -m py_compile research/bivariate_poisson_score_oos.py
          python -m py_compile research/npb_game_type_ablation.py
          python -m py_compile research/compare_game_type_ablation.py
          python -m py_compile research/upset_uncertainty_oos.py
          python -m research.matchday_intelligence
          python -m research.matchday_policy
          python -m research.matchday_policy_learning
          python -m research.matchday_replay
          python -m research.matchday_settle
          python -m research.matchday_change_ledger
          python -m research.matchday_effect_dataset
          python -m research.ci_runtime_smoke
          python -m research.matchday_effect_fit
          python -m json.tool results/matchday_effects.json >/dev/null
          python -m research.matchday_reforecast | tee matchday_reforecast_smoke.json
          python -m json.tool matchday_reforecast_smoke.json >/dev/null
          python backtest_audit_v2.py
          python -m research.drift_uncertainty_routing
          python -m research.routing_oos_replay
          python -m json.tool results/routing_oos_replay.json >/dev/null
          python -m research.routing_acceptance_gate
          python -m json.tool results/routing_acceptance_gate.json >/dev/null
          python -m research.calibration_oos
          python -m research.negative_binomial_score_oos
          python -m research.bivariate_poisson_score_oos
          python -m research.upset_uncertainty_oos
          python -m json.tool results/upset_uncertainty_oos.json >/dev/null
          python -m json.tool results/bivariate_poisson_score_oos.json >/dev/null
          python -m json.tool results/calibration_oos.json >/dev/null
          python -m pytest -q tests
          echo "All Baseball Python syntax/runtime smoke checks passed"
