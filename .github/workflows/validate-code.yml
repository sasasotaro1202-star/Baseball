name: Validate Code Syntax
on:
  push:
    paths:
      - '**.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: |
          python -m py_compile run.py
          python -m py_compile elo_baseline_all.py
          python -m py_compile pipelines/collect.py
          python -m py_compile source_quality_gate.py
          python -m py_compile production_integrity_gate.py
          echo "All Python files passed syntax validation"
