name: Validate Code Syntax
on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: baseball-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if pip install --disable-pip-version-check -r requirements.txt; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
          exit 1
      - name: Validate GitHub Actions workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml",".github/workflows/*.yaml"].flatten.sort.each { |p| YAML.load_file(p); puts "[YAML] PASS #{p}" }'
      - name: Validate Python syntax
        run: |
          python -m py_compile run.py
          python -m py_compile elo_baseline_all.py
          python -m py_compile pipelines/collect.py
          python -m py_compile source_quality_gate.py
          python -m py_compile production_integrity_gate.py
          python -m py_compile baseball_backtest.py
          python -m py_compile npb_multi_source.py
          python -m py_compile npb_runtime_patch.py
          python -m py_compile npb_official_schedule_patch.py
          python -m py_compile npb_quality_runtime_patch.py
          python -m py_compile baseball_backtest_runtime_patch.py
          python -m py_compile baseball_production_runtime_patch.py
          python -m py_compile baseball_quality_runtime_patch.py
          python -m py_compile baseball_mlb_score_hilo_patch.py
          python -m py_compile backtest_audit_v2.py
          python -m py_compile research/research_loop.py
          python -m py_compile research/openai_research_advisor.py
          python -m py_compile research/frozen_holdout_gate.py
          python - <<'PY'
          import pandas as pd
          from baseball_backtest import BaseballBacktest
          b = BaseballBacktest()
          row = pd.Series({
              "league":"NPB","datetime":pd.Timestamp("2026-09-24T18:00:00"),
              "home":"広島東洋カープ","away":"読売ジャイアンツ",
              "home_starter":"A","away_starter":"B",
              "home_lineup_json":"[]","away_lineup_json":"[]",
              "weather_temp_c":25.0,"weather_humidity_pct":60.0,
              "weather_wind_kmh":8.0,"weather_precip_mm":0.0,
          })
          first = b.match_features(row)
          assert "h_games_last_3d" in first and "home_bullpen_short_rest" in first
          sh, sa = b.state("NPB","広島東洋カープ"), b.state("NPB","読売ジャイアンツ")
          b._update_team(sh, 0, 5, 2, True, 3, pd.Timestamp("2026-09-23T18:00:00"), row, opponent="読売ジャイアンツ")
          b._update_team(sa, 2, 2, 5, False, 0, pd.Timestamp("2026-09-23T18:00:00"), row, opponent="広島東洋カープ")
          later = b._team_features("NPB","広島東洋カープ","home",pd.Timestamp("2026-09-24T18:00:00"),opponent="読売ジャイアンツ")
          assert later["games_last_3d"] == 1.0
          assert later["same_opponent_last_10"] == 1.0
          print("Baseball core runtime smoke: PASS")
          PY
          python backtest_audit_v2.py
          echo "All Baseball Python syntax/runtime smoke checks passed"
