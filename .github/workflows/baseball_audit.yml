name: Baseball Backtest Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseball-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Repair known NPB collector syntax defect
        run: python repair_npb_syntax.py
      - name: Persist source repair when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- npb_multi_source.py; then
            echo "[REPAIR COMMIT] no source repair needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add npb_multi_source.py
            git commit -m "Repair NPB collector syntax"
            git push
          fi
      - name: Compile
        run: python -m py_compile baseball_backtest.py baseball_backtest_runtime_patch.py npb_multi_source.py npb_runtime_patch.py repair_npb_syntax.py backtest_audit.py
      - name: Audit
        run: python backtest_audit.py
