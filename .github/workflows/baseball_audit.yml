name: Baseball Backtest Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run dependency-free deterministic audit
        run: python backtest_audit.py
