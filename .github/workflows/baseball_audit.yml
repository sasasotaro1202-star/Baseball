name: Baseball Backtest Audit

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'results/**'
      - 'research_state.json'
      - 'research_history.json'
      - 'research_plan.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-audit
  cancel-in-progress: false

jobs:
  audit:
    # Keep CI off the user's single self-hosted Mac. This audit previously used
    # ubuntu-latest, where the job failed before steps were created. macos-15
    # also matches the production runtime family without sharing a machine.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run dependency-free deterministic audit
        run: python backtest_audit.py
