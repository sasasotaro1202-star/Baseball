name: Trigger Integrated Pipeline via API
on:
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger integrated-pipeline workflow
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/integrated-pipeline.yml/dispatches \
            -d '{"ref":"main","inputs":{"feature_stage":"5","backtest_folds":"5"}}'
          echo "Pipeline triggered successfully"
