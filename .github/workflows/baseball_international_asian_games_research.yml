name: Baseball International Asian Games Research

on:
  push:
    branches:
      - research/mlb-international-game-types
    paths:
      - 'research/international_asian_games_collector.py'
      - 'international_game_type.py'
      - 'tests/**'
      - '.github/workflows/baseball_international_asian_games_research.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-international-asian-games-research
  cancel-in-progress: true

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          for attempt in 1 2 3 4; do
            if "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check -r requirements.txt; then break; fi
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Syntax and regression tests
        run: |
          set -euo pipefail
          python -m py_compile international_game_type.py research/international_asian_games_collector.py
          python -m pytest -q tests/test_mlb_international_game_type.py

      - name: Collect official Asian Games schedule/results
        run: |
          set -euo pipefail
          python research/international_asian_games_collector.py             --editions 2018,2023,2026             --output results/international_asian_games_schedule.csv

      - name: Fail-closed validate research artifact
        run: |
          set -euo pipefail
          test -s results/international_asian_games_schedule.csv
          test -s results/international_asian_games_schedule.manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          csv_path = Path("results/international_asian_games_schedule.csv")
          manifest_path = Path("results/international_asian_games_schedule.manifest.json")
          df = pd.read_csv(csv_path, low_memory=False)
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          required = {
              "league", "competition", "international_game_category", "edition",
              "game_id", "datetime_jst", "home", "away", "home_score",
              "away_score", "status", "venue", "source_url",
              "source_retrieved_at", "prediction_features_allowed",
              "pit_prediction_status",
          }
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"missing required fields: {sorted(missing)}")
          if df.empty:
              raise SystemExit("empty Asian Games research artifact")
          if set(df["international_game_category"].astype(str)) != {"asian_games"}:
              raise SystemExit("unexpected international competition category")
          if set(df["edition"].astype(int)) != {2018, 2023, 2026}:
              raise SystemExit("expected editions 2018, 2023, 2026 were not all collected")
          if not (~df["prediction_features_allowed"].astype(bool)).all():
              raise SystemExit("prediction features must remain disabled")
          if set(df["pit_prediction_status"].astype(str)) != {"NOT_A_PREDICTION_FEATURE_SOURCE"}:
              raise SystemExit("unexpected PIT feature-source status")
          if not set(df["status"].astype(str)).issubset({"FINAL", "SCHEDULED"}):
              raise SystemExit("unexpected game status")
          final_mask = df["status"].eq("FINAL")
          if df.loc[final_mask, ["home_score", "away_score"]].isna().any().any():
              raise SystemExit("FINAL rows contain missing scores")
          scheduled_mask = df["status"].eq("SCHEDULED")
          if not df.loc[scheduled_mask, ["home_score", "away_score"]].isna().all().all():
              raise SystemExit("SCHEDULED rows contain fabricated scores")
          if manifest["rows"] != len(df) or manifest["final_rows"] != int(final_mask.sum()) or manifest["scheduled_rows"] != int(scheduled_mask.sum()):
              raise SystemExit("manifest counts do not match artifact")
          print({
              "rows": len(df),
              "final_rows": int(final_mask.sum()),
              "scheduled_rows": int(scheduled_mask.sum()),
              "editions": sorted(df["edition"].astype(int).unique().tolist()),
          })
          PY

      - name: Upload research-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseball-asian-games-research
          path: |
            results/international_asian_games_schedule.csv
            results/international_asian_games_schedule.manifest.json
          if-no-files-found: error
          retention-days: 30
