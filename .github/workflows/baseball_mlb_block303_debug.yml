name: Baseball MLB Block 303 Debug

on:
  push:
    branches:
      - debug/mlb-block-303
    paths:
      - 'research/debug_mlb_block303.py'
      - '.github/workflows/baseball_mlb_block303_debug.yml'
      - 'baseball_backtest.py'
      - 'mlb_game_type.py'
      - 'international_game_type.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: baseball-mlb-block303-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Setup dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Download shared MLB dataset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baseball-mlb-ablation-data
          path: data
          repository: sasasotaro1202-star/Baseball
          run-id: 36107364013
      - name: Run focused diagnostic
        run: |
          set -euo pipefail
          python research/debug_mlb_block303.py
