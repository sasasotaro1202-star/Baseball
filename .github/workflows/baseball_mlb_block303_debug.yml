name: Baseball MLB Block 303 Debug

on:
  push:
    branches:
      - debug/mlb-block-303
    paths:
      - 'research/debug_mlb_block303.py'
      - '.github/workflows/baseball_mlb_block303_debug.yml'
      - 'baseball_backtest.py'
      - 'mlb_game_type.py'
      - 'international_game_type.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: baseball-mlb-block303-debug
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Setup dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Acquire MLB dataset
        env:
          MLB_BOOTSTRAP_START_YEAR: "2020"
          MLB_CORRECTION_DAYS: "14"
          BASEBALL_DATA_DIR: data
        run: |
          set -euo pipefail
          python mlb_incremental_acquire.py
      - name: Run focused diagnostic
        run: |
          set -euo pipefail
          python research/debug_mlb_block303.py
