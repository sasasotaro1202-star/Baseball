name: International Baseball Data Acquisition
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

concurrency:
  group: international-baseball-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          clean: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m pip install --disable-pip-version-check pandas requests lxml; then exit 0; fi
            sleep $((attempt * 4))
          done
          exit 1
      - name: Acquire official Asian Games baseball results
        run: |
          set -euo pipefail
          python international_asian_games_acquire.py
          test -s data/international_games.csv
          python - <<'PY'
          import pandas as pd
          p="data/international_games.csv"
          df=pd.read_csv(p)
          required={"league","game_id","datetime","home","away","home_score","away_score","competition"}
          missing=required-set(df.columns)
          if missing: raise SystemExit(f"missing columns: {sorted(missing)}")
          if df.empty: raise SystemExit("empty international dataset")
          print(f"[INTERNATIONAL] schema PASS rows={len(df)}")
          PY
      - name: Verify taxonomy on acquired data
        run: |
          set -euo pipefail
          python -m py_compile baseball_game_type.py international_asian_games_acquire.py baseball_backtest.py
          python -m pytest -q tests/test_unified_game_type.py
          python - <<'PY'
          import pandas as pd
          df=pd.read_csv("data/international_games.csv")
          assert set(df["competition"].astype(str).str.contains("Asian Games").unique()) <= {True}
          print("[INTERNATIONAL] Asian Games classification source rows PASS")
          PY
      - name: Persist research data only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/international_games.csv
          if git diff --cached --quiet; then
            echo "[INTERNATIONAL] no data change"
            exit 0
          fi
          git commit -m "Update official Asian Games baseball research data"
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin main; then
              echo "[INTERNATIONAL] fetch failed attempt ${attempt}"
            elif git rebase origin/main && git push origin HEAD:main; then
              echo "[INTERNATIONAL] push PASS attempt ${attempt}"
              exit 0
            else
              echo "[INTERNATIONAL] push/rebase failed attempt ${attempt}"
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 4))
          done
          echo "[INTERNATIONAL] push failed after retries"
          exit 1
