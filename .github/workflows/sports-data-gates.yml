name: Sports Data Gates

on:
  pull_request:
    paths:
      - 'core/**'
      - 'schemas/**'
      - 'sports_data_pipeline_v2.py'
      - 'tests/**'
      - '.github/workflows/sports-data-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas

      - name: Run gate unit tests
        run: pytest -q tests/test_sports_data_gates.py

      - name: Compile gate engine
        run: python -m py_compile core/schema_gate.py core/id_registry.py core/cutoff_gate.py sports_data_pipeline_v2.py
