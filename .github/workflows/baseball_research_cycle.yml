name: Baseball Research Cycle

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseball-research-cycle
  cancel-in-progress: false

jobs:
  research:
    name: Research and evaluate models
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BASEBALL_TIME_BUDGET_SEC: "3600"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Audit
        run: |
          if [ -f backtest_audit.py ]; then python backtest_audit.py; fi

      - name: Run research cycle
        run: |
          mkdir -p research_logs
          python - <<'PY'
          import json,datetime,os
          from pathlib import Path
          Path('research_logs').mkdir(exist_ok=True)
          data={
            'time':datetime.datetime.utcnow().isoformat(),
            'budget_sec':os.environ.get('BASEBALL_TIME_BUDGET_SEC'),
            'status':'research_cycle_started',
            'targets':['win','score','low_high','component_accuracy']
          }
          Path('research_logs/latest.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY

      - name: Save research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_logs || true
          git commit -m "Update baseball research cycle state" || echo "No changes"
          git push || true

      - name: Upload research log
        uses: actions/upload-artifact@v4
        with:
          name: baseball-research-log
          path: research_logs
