name: Baseball Recovery Validation Gate Test

on:
  push:
    branches:
      - fix/recovery-validation-race
    paths:
      - 'baseball_production_runtime_patch.py'
      - '.github/workflows/baseball_production.yml'
      - '.github/workflows/baseball_recovery_validation_gate_test.yml'
      - 'tests/test_production_workflow_gate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-recovery-validation-gate-test
  cancel-in-progress: true

jobs:
  gate-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest>=8,<9'
      - name: Regression test
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_production_workflow_gate.py
