name: Baseball Strict Integration Heartbeat

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseball-strict-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    name: Strict Baseball integrity heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          clean: true
          persist-credentials: false

      - name: Hosted connectivity gate
        run: |
          set -euo pipefail
          python3 --version
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --max-time 20 https://api.github.com/rate_limit >/dev/null
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --retry-all-errors --max-time 20 https://npb.jp/ >/dev/null
          echo '[HEARTBEAT] GitHub + NPB connectivity PASS'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          for attempt in 1 2 3 4; do
            if python -m pip install --disable-pip-version-check -r requirements.txt; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
          exit 1

      - name: Strict integrity smoke
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python -m py_compile backtest_audit_v2.py production_integrity_gate.py production_data_quality_gate.py production_matchday_intelligence.py
          python -m research.conformal_uncertainty >/dev/null
          python -m research.drift_uncertainty_routing >/dev/null
          python -m research.matchday_intelligence >/dev/null
          python -m research.matchday_policy >/dev/null
          python backtest_audit_v2.py
          echo '[HEARTBEAT] strict integrity PASS'
